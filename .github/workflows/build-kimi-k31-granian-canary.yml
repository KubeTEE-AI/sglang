name: Kimi K3.1 Granian mTLS canary

# Build only on GitHub-hosted runners per KubeTEE image policy. The parent is
# the production K3.1 digest; no CUDA/MoE/Rust extension is rebuilt here.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Canary branch or tag. Only this canary's guarded diff is permitted."
        required: true
        default: kubetee/kimi-k31-granian-mtls-h2-canary
        type: string

concurrency:
  group: kimi-k31-granian-canary
  cancel-in-progress: false

permissions:
  contents: read

env:
  BASE_IMAGE: lmsysorg/sglang:dev-kimi-k31-pro@sha256:4a098ad7414702a2271296ac148854448d10710ec3554ac93b57ef194999305a
  BASE_COMMIT: 35708f76dfb720f831f7028ddb68250b6caa8f12

jobs:
  provenance:
    name: Verify guarded transport source
    if: github.repository == 'KubeTEE-AI/sglang'
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.plan.outputs.source_sha }}
      image: ${{ steps.plan.outputs.image }}
    steps:
      - name: Check out the requested canary branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Lint GitHub Actions workflow
        run: |
          curl --fail --silent --show-error --location \
            'https://raw.githubusercontent.com/rhysd/actionlint/v1.7.11/scripts/download-actionlint.bash' \
            -o /tmp/kimi-actionlint.bash
          mkdir -p /tmp/kimi-actionlint-bin
          # CI only: version-pinned upstream release script, never KubeTEE cluster tooling.
          bash /tmp/kimi-actionlint.bash 1.7.11 /tmp/kimi-actionlint-bin
          /tmp/kimi-actionlint-bin/actionlint -color
          python3 -m pip install 'zizmor==1.33.0'
          zizmor --persona=pedantic --no-online-audits .github/workflows/build-kimi-k31-granian-canary.yml
      - name: Resolve immutable source and allowlisted transport diff
        id: plan
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [ "$REQUESTED_REF" != "kubetee/kimi-k31-granian-mtls-h2-canary" ]; then
            echo "Only the guarded canary branch may be used."
            exit 1
          fi
          if [ -z "$REQUESTED_REF" ] || [ -n "${REQUESTED_REF%%${GITHUB_REF_NAME}}" ]; then
            echo "Build ref must exactly match workflow's protected branch: $GITHUB_REF_NAME"
            exit 1
          fi
          if ! git cat-file -e "${BASE_COMMIT}^{commit}" 2>/dev/null; then
            # Shallow checkout is enough, but the pinned base needs explicit ancestry verification.
            git fetch --no-tags --depth=1 origin "${BASE_COMMIT}"
          fi
          git merge-base --is-ancestor "$BASE_COMMIT" HEAD
          git add .github/workflows/build-kimi-k31-granian-canary.yml docker/k31-image/canary-test-requirements.txt docker/kubetee-granian-canary.Dockerfile python/sglang/srt/entrypoints/health_check.py scripts/kimi-k31-granian-transport-test.py test/registered/unit/entrypoints/test_granian_mtls_health_only.py
          CHANGED=$(git diff --cached --name-only "${BASE_COMMIT}" -- ':!python/sglang/srt/arg_groups/fields/serving.py' ':!python/sglang/srt/arg_groups/serving_hook.py' ':!python/sglang/srt/entrypoints/http_server.py' ':!python/sglang/srt/entrypoints/health_check.py' ':!.github/workflows/build-kimi-k31-granian-canary.yml' ':!docker/k31-image/canary-test-requirements.txt' ':!docker/kubetee-granian-canary.Dockerfile' ':!scripts/kimi-k31-granian-transport-test.py' ':!test/registered/unit/entrypoints/test_granian_mtls_health_only.py')
          if [ -n "$CHANGED" ]; then
            printf '%s\n' "The transport canary cannot alter compiled/model/dependency files:" "$CHANGED"
            exit 1
          fi
          SOURCE_SHA=$(git rev-parse HEAD)
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/kubetee-ai/sglang:kimi-k31-granian-mtls-${GITHUB_RUN_ID}-${SOURCE_SHA:0:8}" >> "$GITHUB_OUTPUT"
          echo "Transport-only immutable source: $SOURCE_SHA"

  build:
    name: Build and verify K3.1 transport canary
    needs: provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Push the immutable GHCR candidate image.
      id-token: write # OIDC for build-provenance signing.
      attestations: write # Publish the source-to-image attestation.
    env:
      SRC_SHA: ${{ needs.provenance.outputs.source_sha }}
      IMAGE: ${{ needs.provenance.outputs.image }}
    steps:
      - name: Clean initial repository state
        run: git clean -ffdx && git reset --hard
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          clean: true
          ref: ${{ needs.provenance.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert exact production base image identity
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$BASE_IMAGE"
          RECORDED=$(docker run --rm --platform linux/amd64 --entrypoint /bin/cat "$BASE_IMAGE" /sgl-workspace/sglang/.k31-source-commit)
          if [ "$RECORDED" != "$BASE_COMMIT" ]; then
            echo "Image's .k31-source-commit ($RECORDED) is not the requested base ($BASE_COMMIT)."
            exit 1
          fi
          docker run --rm --platform linux/amd64 --entrypoint python3 "$BASE_IMAGE" /sgl-workspace/sglang/docker/k31-image/verify_image.py
          echo "Verified parent source: $BASE_IMAGE -> $RECORDED"
      - name: Prepare the exact transport patch
        shell: bash
        id: patch
        run: |
          set -euo pipefail
          mkdir context
          git diff --cached --binary "${BASE_COMMIT}" -- \
            python/sglang/srt/arg_groups/fields/serving.py \
            python/sglang/srt/arg_groups/serving_hook.py \
            python/sglang/srt/entrypoints/http_server.py \
            python/sglang/srt/entrypoints/health_check.py > context/merged.patch
          git diff --cached --name-only --diff-filter=AMR "${BASE_COMMIT}" -- \
            'python/sglang/srt/arg_groups/fields/serving.py' \
            'python/sglang/srt/arg_groups/serving_hook.py' \
            'python/sglang/srt/entrypoints/http_server.py' \
            'python/sglang/srt/entrypoints/health_check.py' > context/changed_py.txt
          git worktree add --detach /tmp/kimi-canary-base "${BASE_COMMIT}"
          git -C /tmp/kimi-canary-base apply --check < "${PWD}/context/merged.patch"
          git worktree remove --force /tmp/kimi-canary-base
          cp docker/kubetee-granian-canary.Dockerfile context/Dockerfile
          cp scripts/kimi-k31-granian-transport-test.py context/scripts-transport-launcher.py
          cp test/registered/unit/entrypoints/test_granian_mtls_health_only.py context/transport-test.py
          cp -r docker/k31-image context/k31-image
          echo "PATCH_SHA256=$(sha256sum context/merged.patch | cut -d' ' -f1)" >> "$GITHUB_ENV"
          cp docker/k31-image/canary-test-requirements.txt context/k31-image/
          echo "PATCH_SHA256=$(sha256sum context/merged.patch | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "Source: ${SRC_SHA}; base: ${BASE_IMAGE}; patch: ${PATCH_SHA256}"
      - name: Build, transport-test and publish immutable image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: context
          file: context/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            SRC_SHA=${{ env.SRC_SHA }}
            PATCH_SHA256=${{ env.PATCH_SHA256 }}
          labels: |
            org.opencontainers.image.revision=${{ env.SRC_SHA }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            ai.kubetee.base-image=${{ env.BASE_IMAGE }}
            ai.kubetee.canary.run-id=${{ github.run_id }}
            ai.kubetee.canary.transport=granian-mtls-health-only-uvicorn
          provenance: mode=max
      - name: Assert immutable source, commit-linked run and digest
        id: publish
        run: |
          set -euo pipefail
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "CANDIDATE=${IMAGE}@${DIGEST}" >> "$GITHUB_ENV"
          {
            echo "## Kimi K3.1 transport-only canary"
            echo '- **Source:** `'${SRC_SHA}'`'
            echo '- **Base:** `'${BASE_IMAGE}'`'
            echo '- **Immutable candidate:** `'${IMAGE}@${DIGEST}'`'
            echo '- **GitHub Actions run:** '${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
            echo '- **Transport build checks:** original K3.1 compiled-feature verifier + actual CLI Granian/Uvicorn transport harness.'
            echo '- **Deployment:** not authorized by this build; .39 only.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Attest image provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Preserve source-to-run-to-digest provenance
        run: |
          test -n "${CANDIDATE:?The digest publication must set the candidate}"
          printf 'source=%s\nbase=%s\nrun=%s\ncandidate=%s\n' \
            "$SRC_SHA" "$BASE_IMAGE" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "${CANDIDATE}" > provenance.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kimi-k31-granian-source-run-digest
          path: provenance.txt
          if-no-files-found: error
          retention-days: 30
