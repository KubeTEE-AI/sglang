name: Kimi K3.1 Granian mTLS canary

# Build only on GitHub-hosted runners per KubeTEE policy. The parent has the
# deployed K3.1 CUDA/MoE/Rust extensions; only its HTTP transport is patched.
# The recorded base lineage, not the Dockerfile path, constrains verification.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Only the guarded canary branch is permitted."
        required: true
        default: kubetee/kimi-k31-granian-mtls-day0
        type: string
      attest_only:
        description: "Attest the tested immutable digest from a prior run; do not rebuild."
        required: false
        default: ""
        type: string

concurrency:
  group: kimi-k31-granian-canary
  cancel-in-progress: false

permissions:
  contents: read

env:
  BASE_IMAGE: lmsysorg/sglang:dev-kimi-k31-pro@sha256:4a098ad7414702a2271296ac148854448d10710ec3554ac93b57ef194999305a
  BASE_COMMIT: afcd7d6b487a9cbe73e25941971b4cc107e6f9ae

jobs:
  provenance:
    name: Verify guarded transport source
    if: github.repository == 'KubeTEE-AI/sglang'
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.plan.outputs.source_sha }}
      image: ${{ steps.plan.outputs.image }}
      source_prefix: ${{ steps.plan.outputs.source_prefix }}
    steps:
      - name: Check out the requested canary branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Lint GitHub Actions workflow
        run: |
          curl --fail --silent --show-error --location \
            'https://raw.githubusercontent.com/rhysd/actionlint/v1.7.11/scripts/download-actionlint.bash' \
            -o /tmp/kimi-actionlint.bash
          mkdir -p /tmp/kimi-actionlint-bin
          bash /tmp/kimi-actionlint.bash 1.7.11 /tmp/kimi-actionlint-bin
          /tmp/kimi-actionlint-bin/actionlint -color .github/workflows/build-kimi-k31-granian-canary.yml
          python3 -m pip install 'zizmor==1.33.0'
          zizmor --persona=pedantic --no-online-audits .github/workflows/build-kimi-k31-granian-canary.yml
      - name: Resolve immutable source and allowlisted transport diff
        id: plan
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [ "$REQUESTED_REF" != "kubetee/kimi-k31-granian-mtls-day0" ] ||
             [ "$GITHUB_REF_NAME" != "$REQUESTED_REF" ]; then
            echo "Build ref must match the guarded canary branch."
            exit 1
          fi
          if ! git cat-file -e "${BASE_COMMIT}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "${BASE_COMMIT}"
          fi
          git merge-base --is-ancestor "$BASE_COMMIT" HEAD
          CHANGED=$(git diff --name-only "${BASE_COMMIT}" -- \
            ':!python/sglang/srt/arg_groups/fields/serving.py' \
            ':!python/sglang/srt/arg_groups/serving_hook.py' \
            ':!python/sglang/srt/entrypoints/http_server.py' \
            ':!python/sglang/srt/entrypoints/health_check.py' \
            ':!.github/workflows/build-kimi-k31-granian-canary.yml' \
            ':!docker/k31-image/canary-test-requirements.txt' \
            ':!docker/k31-image/check_canary_context.py' \
            ':!docker/kubetee-granian-canary.Dockerfile' \
            ':!scripts/kimi-k31-granian-transport-test.py' \
            ':!test/registered/unit/entrypoints/test_granian_mtls_health_only.py')
          if [ -n "$CHANGED" ]; then
            printf '%s\n' "The transport canary cannot alter non-transport files:" "$CHANGED"
            exit 1
          fi
          SOURCE_SHA=$(git rev-parse HEAD)
          echo "source_prefix=${SOURCE_SHA:0:8}" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/kubetee-ai/sglang:kimi-k31-granian-mtls-${GITHUB_RUN_ID}-${SOURCE_SHA:0:8}" >> "$GITHUB_OUTPUT"
          echo "Transport-only immutable source: $SOURCE_SHA"

  build:
    name: Build, network-test and publish K3.1 transport canary
    needs: provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Push the immutable GHCR candidate.
      id-token: write # OIDC for signed provenance.
      attestations: write # Publish the candidate's attestation.
    env:
      SRC_SHA: ${{ needs.provenance.outputs.source_sha }}
      IMAGE: ${{ needs.provenance.outputs.image }}
      SOURCE_PREFIX: ${{ needs.provenance.outputs.source_prefix }}
      POST_ATTEST_ONLY: ${{ inputs.attest_only }}
    steps:
      - name: Check out the exact resolved source commit
        if: inputs.attest_only == ''
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.provenance.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reclaim unused GitHub-hosted runner space
        if: inputs.attest_only == ''
        # Ephemeral ubuntu-latest only: never run this cleanup on a cluster node.
        # Preserve Docker and the verified parent image. The huge FlashInfer
        # base must not be imported twice when its thin transport patch builds.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          docker-images: false
      - name: Set up Docker Buildx using the daemon-local base image
        if: inputs.attest_only == ''
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          # The docker driver prefers the exact locally pulled base and reuses
          # its unpacked layers; a docker-container buildkit snapshot instead
          # duplicates the huge parent, exhausting this hosted runner's disk.
          driver: docker
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert exact production base image identity
        if: inputs.attest_only == ''
        run: |
          set -euo pipefail
          docker pull --quiet --platform linux/amd64 "$BASE_IMAGE"
          docker run --rm --platform linux/amd64 --entrypoint /bin/cat "$BASE_IMAGE" /sgl-workspace/sglang/.k31-source-commit
          RECORDED=$(docker run --rm --platform linux/amd64 --entrypoint /bin/cat "$BASE_IMAGE" /sgl-workspace/sglang/.k31-source-commit)
          printf "Expected %s; recorded: <%q>; length=%s\n" "$BASE_COMMIT" "$RECORDED" "${#RECORDED}"
          if [ "$RECORDED" != "$BASE_COMMIT" ]; then
            echo "STOP: source provenance disagreement. Inspect parent metadata; do not force tag reuse or replace the pinned parent."
            docker image inspect "$BASE_IMAGE" --format '{{json .Config.Labels}}'
            exit 1
          fi
          docker buildx inspect | python3 -c 'import sys; d=dict(line.split(":",1) for line in sys.stdin if ":" in line); assert d.get("Driver","").strip() == "docker", d'
          echo "docker_storage_driver=$(docker info --format '{{.Driver}}')"
          df -h /
          docker system df
          docker run --rm --platform linux/amd64 --entrypoint python3 "$BASE_IMAGE" /sgl-workspace/sglang/docker/k31-image/verify_image.py
          echo "Verified parent source: $BASE_IMAGE -> $RECORDED"
      - name: Prepare the exact transport patch
        if: inputs.attest_only == ''
        shell: bash
        run: |
          set -euo pipefail
          test "${SRC_SHA}" = "$(git rev-parse HEAD)"
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          mkdir context
          git diff --binary "${BASE_COMMIT}" -- \
            python/sglang/srt/arg_groups/fields/serving.py \
            python/sglang/srt/arg_groups/serving_hook.py \
            python/sglang/srt/entrypoints/http_server.py \
            python/sglang/srt/entrypoints/health_check.py > context/merged.patch
          git diff --name-only --diff-filter=AMR "${BASE_COMMIT}" -- \
            python/sglang/srt/arg_groups/fields/serving.py \
            python/sglang/srt/arg_groups/serving_hook.py \
            python/sglang/srt/entrypoints/http_server.py \
            python/sglang/srt/entrypoints/health_check.py > context/changed_py.txt
          git worktree add --detach /tmp/kimi-canary-base "${BASE_COMMIT}"
          git -C /tmp/kimi-canary-base apply --check < "${PWD}/context/merged.patch"
          git worktree remove --force /tmp/kimi-canary-base
          cp docker/kubetee-granian-canary.Dockerfile context/Dockerfile
          cp scripts/kimi-k31-granian-transport-test.py context/scripts-transport-launcher.py
          cp test/registered/unit/entrypoints/test_granian_mtls_health_only.py context/transport-test.py
          cp -r docker/k31-image context/k31-image
          # Validate every static COPY source against this actual build context.
          # Keep source-tree and build-context paths explicit; never rely on an
          # image pull, parent directory, or tree outside the staged context.
          python3 docker/k31-image/check_canary_context.py context
          echo "PATCH_SHA256=$(sha256sum context/merged.patch | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "Source: ${SRC_SHA}; base: ${BASE_IMAGE}"
      - name: Build, transport-test and publish immutable image
        if: inputs.attest_only == ''
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: context
          file: context/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            SRC_SHA=${{ env.SRC_SHA }}
            PATCH_SHA256=${{ env.PATCH_SHA256 }}
          labels: |
            org.opencontainers.image.revision=${{ env.SRC_SHA }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            ai.kubetee.base-image=${{ env.BASE_IMAGE }}
            ai.kubetee.canary.run-id=${{ github.run_id }}
            ai.kubetee.canary.transport=granian-mtls-health-only-uvicorn
          provenance: mode=max
      - name: Resolve only the already-tested immutable image
        if: inputs.attest_only != ''
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}@${POST_ATTEST_ONLY}" --format '{{json .}}' > /tmp/attest-manifest.json
          docker buildx imagetools inspect "${IMAGE}@${POST_ATTEST_ONLY}" --format '{{json .Image}}' > /tmp/attest-config.json
          python3 - <<'PY'
          import json, os, re
          image = json.load(open("/tmp/attest-manifest.json"))
          assert image["mediaType"] == "application/vnd.oci.image.manifest.v1+json", image["mediaType"]
          assert re.fullmatch(r"sha256:[0-9a-f]{64}", os.environ["POST_ATTEST_ONLY"])
          tag = re.fullmatch(r"ghcr\.io/.+:kimi-k31-granian-mtls-([0-9]+)-([0-9a-f]{8})", os.environ["IMAGE"])
          assert tag, os.environ["IMAGE"]
          assert tag.group(2) == os.environ["SOURCE_PREFIX"], "attest_only requires the exact successful-build commit"
          assert image["mediaType"] == "application/vnd.oci.image.manifest.v1+json", image["mediaType"]
          labels = json.load(open("/tmp/attest-config.json")).get("config", {}).get("Labels", {})
          assert labels.get("ai.kubetee.base-image") == os.environ["BASE_IMAGE"], labels
          assert labels.get("org.opencontainers.image.revision") == os.environ["SRC_SHA"], labels
          print("Recovered the tested image labels; no rebuild needed.")
          PY
          {
            echo "source=${SRC_SHA}"
            echo "base=${BASE_IMAGE}"
            echo "run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "candidate=${IMAGE}@${POST_ATTEST_ONLY}"
            echo "attestation-ref=https://github.com/${GITHUB_REPOSITORY}/attestations"
          } > provenance.txt
          echo "CANDIDATE=${IMAGE}@${POST_ATTEST_ONLY}" >> "$GITHUB_ENV"
      - name: Resolve the deployable amd64 manifest, not the attestation index
        if: inputs.attest_only == ''
        id: resolve
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}" --raw > /tmp/kimi-candidate.json
          # A single-platform image manifest is itself the subject. With an
          # index, select its linux/amd64 child excluding the attestation.
          DIGEST=$(python3 - "${BUILD_DIGEST}" <<'PY'
          import json, re, sys
          m = json.load(open("/tmp/kimi-candidate.json"))
          if m.get("mediaType") == "application/vnd.oci.image.index.v1+json":
              matches = [x["digest"] for x in m["manifests"]
                         if x.get("platform") == {"os": "linux", "architecture": "amd64"}
                         and x.get("annotations", {}).get("vnd.docker.reference.type")
                         != "attestation-manifest"]
              assert len(matches) == 1, matches
              print(matches[0])
          else:
              assert m.get("mediaType") in {
                  "application/vnd.oci.image.manifest.v1+json",
                  "application/vnd.docker.distribution.manifest.v2+json",
              }, m.get("mediaType")
              assert re.fullmatch(r"sha256:[0-9a-f]{64}", sys.argv[1]), sys.argv[1]
              print(sys.argv[1])
          PY
          )
          test -n "$DIGEST"
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format '{{json .Image}}' > /tmp/kimi-candidate-image.json
          python3 - <<'PY'
          import json, os
          image = json.load(open("/tmp/kimi-candidate-image.json"))
          labels = image.get("config", {}).get("Labels", {})
          assert labels.get("org.opencontainers.image.revision") == os.environ["SRC_SHA"], labels
          assert labels.get("ai.kubetee.base-image") == os.environ["BASE_IMAGE"], labels
          print("Candidate labels verify the committed source and exact parent.")
          PY
          test -n "$DIGEST"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "CANDIDATE=${IMAGE}@${DIGEST}" >> "$GITHUB_ENV"
          {
            echo "## K3.1 transport-only canary"
            echo "Source: \`${SRC_SHA}\`; base: \`${BASE_IMAGE}\`"
            echo "Immutable candidate: \`${IMAGE}@${DIGEST}\`"
            echo "Not a deployment authorization; .39 only."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Attest image provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          # attestation subject input accepts tag@digest but not :tag alone.
          subject-name: ${{ env.CANDIDATE }}
          subject-digest: ${{ env.CANDIDATE }}
          push-to-registry: true
      - name: Preserve commit, run, digest and attestation references
        id: publish
        run: |
          set -euo pipefail
          DIGEST=${CANDIDATE##*@}
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          printf 'source=%s\nbase=%s\nrun=%s\ncandidate=%s\nattestation-ref=%s\n' \
            "$SRC_SHA" "$BASE_IMAGE" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "$CANDIDATE" \
            "https://github.com/${GITHUB_REPOSITORY}/attestations" > provenance.txt
      - name: Upload source-to-run-to-digest provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kimi-k31-granian-source-run-digest
          path: provenance.txt
          if-no-files-found: error
          retention-days: 30
