# Build the KubeTEE v0.5.18 abort-disconnect overlay (linux/amd64) and
# push ghcr.io/kubetee-ai/sglang:v0.5.18-abort-disconnect.
#
# Thin FROM lmsysorg/sglang:v0.5.18 — still a ~20 GiB pull. Runs on the
# org self-hosted Linux/X64 runner (GitHub-hosted disk is too small).
name: KubeTEE sglang image

on:
  workflow_dispatch:
  push:
    branches: [v0.5.18-abort-disconnect]
    paths:
      - python/sglang/srt/managers/tokenizer_manager.py
      - docker/kubetee-v0.5.18-abort-disconnect.Dockerfile
      - .github/workflows/kubetee-image.yml

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kubetee-ai/sglang
  IMAGE_TAG: v0.5.18-abort-disconnect

permissions:
  contents: read
  packages: write

jobs:
  build-amd64:
    name: build and push linux/amd64
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/kubetee-v0.5.18-abort-disconnect.Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/KubeTEE-AI/sglang
            org.opencontainers.image.description=lmsysorg/sglang v0.5.18 plus PR 35936 abort-then-pop (linux/amd64)
            org.opencontainers.image.revision=${{ github.sha }}
